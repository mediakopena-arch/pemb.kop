<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoperasiKu - Sistem Tagihan Mitra Usaha</title>
<style>
:root{--p:#0e6e5d;--pd:#0a4f43;--a:#f0a92e;--bg:#f2f5f4;--tx:#1e2b28;--mut:#7a8a86;--card:#fff;--line:#e2e9e7;--red:#c0392b;--blue:#2563eb;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:var(--tx)}
/* LOGIN */
#loginView{display:flex;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p),var(--pd))}
.login-card{background:#fff;padding:36px;border-radius:14px;width:360px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.login-card h1{color:var(--p);font-size:22px;margin-bottom:2px}
.login-card p{color:var(--mut);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600}
.btn-p{background:var(--p);color:#fff;width:100%;margin-top:18px}
.btn-p:hover{background:var(--pd)}
.btn-a{background:var(--a);color:#3a2a00}
.btn-s{background:#e8eeec;color:var(--tx)}
.btn-d{background:var(--red);color:#fff;padding:5px 10px;font-size:12px}
.err{background:#fdecea;color:var(--red);padding:8px 12px;border-radius:8px;font-size:13px;margin-top:14px;display:none}
/* APP */
#appView{display:none}
aside{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--pd);color:#fff;padding:20px 0;display:flex;flex-direction:column}
aside .brand{padding:0 20px 18px;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.15)}
aside .brand span{color:var(--a)}
nav{margin-top:14px;flex:1}
nav a{display:block;padding:11px 20px;color:#cfe3de;text-decoration:none;font-size:14px;border-left:3px solid transparent}
nav a:hover,nav a.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--a)}
main{margin-left:230px;padding:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h2{font-size:20px}
.userchip{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:30px;font-size:13px;display:flex;gap:10px;align-items:center}
.userchip b{color:var(--p)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h4{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase}
.card .v{font-size:22px;font-weight:700;margin-top:6px}
.card .s{font-size:12px;color:var(--mut);margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:14px;color:var(--p)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f6f9f8;text-align:left;padding:9px 10px;color:var(--mut);font-size:11px;text-transform:uppercase;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafcfb}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b1{background:#e7f6ee;color:#1c7a43}.b2{background:#fff7e0;color:#8a6d00}.b3{background:#fdeede;color:#b25e09}.b4{background:#fdecea;color:var(--red)}.b5{background:#4a1512;color:#ffb3ab}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.mut{color:var(--mut);font-size:12px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap}
.rowflex>*{flex:1;min-width:140px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal .box{background:#fff;border-radius:12px;padding:24px;width:420px;max-width:92vw}
.notif{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.notif.ok{display:block;background:#e7f6ee;color:#1c7a43}
.notif.bad{display:block;background:#fdecea;color:var(--red)}
@media(max-width:820px){aside{width:70px}.brand{font-size:12px!important;padding:0 10px 14px!important}nav a{padding:11px 12px;font-size:12px}main{margin-left:70px}.grid2{grid-template-columns:1fr}}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block!important;position:absolute;left:0;top:0;width:100%;background:#fff;color:#000;padding:0}
  #printArea h1{font-size:14pt;margin:0 0 2px}
  #printArea .print-sub{font-size:9pt;color:#333;margin:0 0 10px}
  #printArea h2{font-size:11pt;margin:12px 0 4px}
  #printArea table{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:6px}
  #printArea th,#printArea td{border:1px solid #999;padding:3px 5px;text-align:left}
  #printArea th{background:#eee}
  #printArea td.num{text-align:right;white-space:nowrap}
}
</style>

function addCabang(){
  const k=(prompt('Kode cabang (3 digit, sama seperti di nomor rekening):\nContoh: untuk rekening 541052000201, kodenya 052')||'').trim();
  if(!/^\d{3}$/.test(k)){notify('Kode cabang harus 3 digit angka, contoh: 052',false);return}
  if(k==='all'||CABANGS.some(c=>c.kode===k)){notify('Kode cabang sudah terdaftar',false);return}
  const n=(prompt('Nama cabang (huruf kapital, contoh: LIMPUNG):')||'').trim().toUpperCase();
  if(!n){notify('Nama cabang wajib diisi',false);return}
  CABANGS.push({kode:k,nama:n});jsave(KCAB,CABANGS);
  notify('Cabang '+k+' — '+n+' ditambahkan ✔');pgUsr();
}
function delCabang(k){
  if(!confirm('Hapus cabang '+k+' dari daftar?'))return;
  CABANGS=CABANGS.filter(c=>c.kode!==k);jsave(KCAB,CABANGS);pgUsr();
}

function inCabang(d){const cb=myCabang();return cb==='all'||cabOf(d)===cb}

  const map={};

  return '<option value="all">🏛️ Pusat (semua cabang)</option>'+
    Object.keys(map).sort().map(c=>`<option value="${c}" ${sel===c?'selected':''}>🏢 ${c} — ${esc(map[c])}</option>`).join('')+

function doLogin(){
  const u=document.getElementById('lgUser').value.trim(),p=document.getElementById('lgPass').value;
  const f=users.find(x=>x.user===u&&x.pass===p);
  if(!f){document.getElementById('lgErr').style.display='block';return}
  SES={user:f.user,nama:f.nama,role:f.role,cabang:f.cabang||'all'};jsave(K.ses,SES);showApp();
}
function logout(){
  try{localStorage.removeItem(K.ses)}catch(e){}
  SES=null;
  document.getElementById('appView').style.display='none';
  document.getElementById('loginView').style.display='flex';
  const u=document.getElementById('lgUser'),pw=document.getElementById('lgPass');
  if(u)u.value=''; if(pw)pw.value='';
  const er=document.getElementById('lgErr'); if(er)er.style.display='none';
  if(u)u.focus();
}

  document.getElementById('loginView').style.display='none';

  document.getElementById('chipName').textContent=SES.nama;

}

function saveLap(){
  const q=document.getElementById('lpRek').value.trim();
  const d=myData().find(x=>x.rekening===q)||myData().find(x=>x.nama.toUpperCase()===q.toUpperCase());
  if(!d){notify('Nasabah tidak ditemukan — ketik lalu pilih dari daftar saran!',false);return}
  const rek=d.rekening;
  LAP.unshift({
    id:Date.now(),tanggalISO:document.getElementById('lpTgl').value,
    tanggal:new Date(document.getElementById('lpTgl').value+'T00:00:00').toLocaleDateString('id-ID'),
    rekening:rek,nama:d.nama,ao:d.ao,
    hasil:document.getElementById('lpHasil').value,
    nominal:parseFloat(document.getElementById('lpNom').value||0),
    catatan:document.getElementById('lpCat').value.trim(),
    petugas:SES.nama
  });
  jsave(K.lap,LAP);notify('Laporan tersimpan ✔');
  syncPush('laporan',true);
  document.getElementById('lpCat').value='';document.getElementById('lpNom').value=0;
  pgLap();
}
function delLap(id){if(confirm('Hapus laporan ini?')){LAP=LAP.filter(l=>l.id!==id);jsave(K.lap,LAP);renderLapList()}}
function renderLapList(){

  let rows=LAP.filter(l=>(!t||l.tanggalISO===t)&&(!u||l.petugas===u)&&(!q||l.nama.toLowerCase().includes(q)||l.rekening.includes(q)));
  document.getElementById('lapList').innerHTML=rows.length?`<table>

function outFiltered(){
  const q=(document.getElementById('oQ').value||'').toLowerCase();
  const ao=document.getElementById('oAO').value,pr=document.getElementById('oProd').value;
  const co=document.getElementById('oColl').value,so=document.getElementById('oSort').value;

  const cbv=document.getElementById('oCab')?.value||'';
  let r=myData().filter(d=>(!q||d.nama.toLowerCase().includes(q)||d.rekening.includes(q))
    &&(!ao||d.ao===ao)&&(!pr||d.produk===pr)&&(!co||Math.min(5,Math.max(1,d.coll_val||1))==co)
    &&(!cbv||cabOf(d)===cbv)
    &&(!st||(d.sudah_angsur?1:0)==st));
  r.sort((a,b)=>so==='out-asc'?a.outstanding-b.outstanding:so==='tak-desc'?(b.tak_pokok-a.tak_pokok):so==='bln-desc'?(b.tak_bln-a.tak_bln):b.outstanding-a.outstanding);
  return r;
}
function renderOut(){

     <td>${esc(d.tgl_jt)}</td></tr>`).join('')}</table></div>`;
}
function exportCSV(){
  const r=outFiltered();
  let csv='\uFEFFRekening;Nama;Produk;AO;Plafond;Outstanding;TunggakanAhirPokok;Bln;Coll;TglJT\n';

function lastCall(rek){return LAP.find(l=>l.rekening===rek)}
function renderPinj(){
  const q=(document.getElementById('pQ').value||'').toLowerCase();
  const ao=document.getElementById('pAO').value,f=document.getElementById('pCall').value;
  const ps=document.getElementById('pStatus').value;
  const bulanIni=todayISO().slice(0,7);
  let r=myData().filter(d=>{
    if(q&&!(d.nama.toLowerCase().includes(q)||d.rekening.includes(q)))return false;
    if(ao&&d.ao!==ao)return false;
    if(ps&&(d.sudah_angsur?1:0)!=ps)return false;
    const lc=lastCall(d.rekening);const called=lc&&(lc.tanggalISO||'').slice(0,7)===bulanIni;
    if(f==='sudah'&&!called)return false;
    if(f==='belum'&&called)return false;
    if(f==='janji'&&!(lc&&lc.hasil==='Janji bayar'))return false;
    if(f==='bayar'&&!(lc&&lc.hasil==='Sudah membayar'))return false;
    if(f==='nores'&&!(lc&&(lc.hasil.includes('tidak diangkat')||lc.hasil.includes('salah'))))return false;
    return true;
  }).sort((a,b)=>b.outstanding-a.outstanding);
  const nSdh2=r.filter(d=>d.sudah_angsur).length;
  document.getElementById('pinjList').innerHTML=`<p class="mut" style="margin-bottom:8px">${r.length} rekening · <b style="color:#1c7a43">✓ ${nSdh2} sudah angsur</b> · <b style="color:var(--red)">✗ ${r.length-nSdh2} belum</b></p>
  <div style="overflow-x:auto"><table>
   <tr><th>Rekening</th><th>Nama</th><th>Produk</th><th>AO</th><th class="r">Outstanding</th><th class="r">Tunggakan</th>
   <th class="r">Bln</th><th>Coll</th><th>Status</th><th>Kondisi Call Terakhir</th><th>Tgl Call</th><th>Petugas</th></tr>
   ${r.map(d=>{const lc=lastCall(d.rekening);return `<tr>
     <td>${d.rekening}</td><td>${esc(d.nama)}</td><td>${d.kode}</td><td>${esc(d.ao)}</td>
     <td class="num"><b>${rp(d.outstanding)}</b></td>
     <td class="num" style="color:${d.tak_pokok>0?'var(--red)':'inherit'}">${rp(d.tak_pokok)}</td>
     <td class="num">${d.tak_bln||0}</td>
     <td><span class="badge ${collClass(d.coll_val)}">${collLabel(d.coll_val)}</span></td>
     <td><span class="badge ${d.sudah_angsur?'b1':'b4'}">${d.sudah_angsur?'✓ Sudah':'✗ Belum'}</span></td>
     <td>${lc?esc(lc.hasil):'<span class="badge b4">BELUM DI-CALL</span>'}</td>
     <td>${lc?esc(lc.tanggal):'-'}</td><td>${lc?esc(lc.petugas):'-'}</td></tr>`}).join('')}</table></div>`;
}

function pgUp(){
  document.getElementById('content').innerHTML=`

    <p class="mut" style="margin-bottom:12px">Unggah file hasil ekspor sistem seperti contoh (format Excel XML 2003). Data lama akan <b>diganti</b> oleh data baru. Admin Pusat dapat mengupload file dari cabang mana pun (otomatis tertanda cabangnya); admin cabang hanya bisa upload file cabangnya sendiri. Status Sudah/Belum angsur dihitung otomatis persis seperti aplikasi lama (kolom "Tagihan Aktif Margin" atau "Tagihan Masuk Pokok" bernilai di atas nol). Setelah upload, data <b>otomatis terbagi per AO</b> berdasarkan kolom "Nama AO" — admin tinggal mengaitkan tiap AO ke akun petugas di menu <b>Pembagian Data AO</b>.</p>
    <div class="toolbar">
      <input type="file" id="upFile" accept=".xls,.xml">
      <button class="btn-p" style="width:auto;margin:0" onclick="doUpload()">📤 Proses Upload</button>
      <button class="btn-s" onclick="resetSample()">↺ Muat Ulang Data Contoh</button>
    </div>
    <div id="upMsg"></div>
    <p class="mut" style="margin-top:14px">Kolom yang dibaca: No. Rekening, Nama, Plafond, Outstanding, Coll, Tunggakan Awal (Pokok/Margin/Bln), Tagihan Aktif (Pokok/Margin), Tagihan Masuk (Pokok/Margin), Tunggakan Akhir (Pokok/Bln), Tgl JT, Nama AO, serta grup produk (mis. 541 / PEMBIAYAAN MURABAHAH ANGSURAN).</p>
  </div>`;
}
function doUpload(){
  const f=document.getElementById('upFile').files[0];
  if(!f){notify('Pilih file dulu!',false);return}
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const rows=parseXMLSpreadsheet(e.target.result);
      if(!rows.length)throw new Error('Tidak ada baris data ditemukan. Pastikan format file sama dengan contoh.');
      if(SES.cabang&&SES.cabang!=='all'){
        const fcb=rows.find(r=>r.cabang);
        if(fcb&&fcb.cabang!==SES.cabang){
          throw new Error('File ini berisi data cabang '+(fcb.cabang_nama||fcb.cabang)+' ('+fcb.cabang+') — berbeda dengan cabang akun Anda ('+SES.cabang+'). Data TIDAK dimuat agar tidak tercampur.');
        }
      }
      DATA=rows;DATA.forEach(d=>d.sudah_angsur=sudahAngsur(d));jsave(K.data,DATA);
      const nAO=new Set(rows.map(r=>r.ao)).size;
      document.getElementById('upMsg').innerHTML=`<div class="notif ok">✔ Berhasil! ${rows.length} rekening dimuat, <b>otomatis terbagi ke ${nAO} kelompok AO</b>. Lanjutkan di menu <b>Pembagian Data AO</b> untuk mengaitkan ke akun petugas.</div>`;
      notify('Data berhasil diupload ✔');
      syncPush('data',true);
    }catch(err){document.getElementById('upMsg').innerHTML=`<div class="notif bad">✖ Gagal: ${esc(err.message)}</div>`}
  };
  rd.readAsText(f);
}
function resetSample(){if(confirm('Kembali ke data contoh? Data upload akan hilang.')){DATA=JSON.parse(JSON.stringify(SAMPLE_DATA));jsave(K.data,DATA);notify('Data contoh dimuat ulang ✔')}}
function parseXMLSpreadsheet(text){
  const km=text.match(/Keseluruhan Kantor\s*:\s*(\d+)\s*\/\s*([^<\n]+)/i)||[];
  const cbCode=km[1]||'', cbName=(km[2]||'').trim();
  const doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('File bukan XML valid');
  const rows=[...doc.getElementsByTagName('Row')];
  let cur=null,out=[];
  const num=v=>{const n=parseFloat(String(v||'').replace(/[^\d.-]/g,''));return isNaN(n)?0:n};
  for(const row of rows){
    const map={};let col=0;
    for(const c of row.getElementsByTagName('Cell')){
      const i=c.getAttribute('ss:Index');col=i?parseInt(i):col+1;
      const d=c.getElementsByTagName('Data')[0];
      if(d&&d.textContent!=null)map[col]=d.textContent.trim();
    }
    const v1=map[1]||'';
    if(/^\d{3}\s*\//.test(v1)){cur=v1;continue}
    if(!/^\d{9,}$/.test(v1)||!cur)continue;
    const m=v1.match(/^(\d{3})/);
    out.push({rekening:v1,nama:map[2]||'',plafond:num(map[3]),outstanding:num(map[4]),
      coll_val:num(map[6]),
      ta_pokok:num(map[7]),ta_margin:num(map[8]),ta_bln:num(map[9]),
      tag_pokok:num(map[10]),tag_margin:num(map[11]),
      masuk_pokok:num(map[12]),masuk_margin:num(map[13]),
      tak_pokok:num(map[14]),tak_margin:0,tak_bln:num(map[15]),
      tgl_jt:map[16]||'',ao:map[17]||'',
      cabang:cbCode||(v1.length>=6?v1.slice(3,6):''),cabang_nama:cbName,
      produk:cur.split('/').slice(1).join('/').trim(),kode:m?m[1]:''});
  }
  return out;
}

/* ================= PEMBAGIAN DATA AO ================= */
function pgAO(){
  const VIS=(SES.role==='admin'&&myCabang()==='all')?DATA:DATA.filter(inCabang);
  const aos=[...new Set(VIS.map(d=>d.ao))].sort((a,b)=>{
    const ca=String(cabOf(VIS.find(d=>d.ao===a))),cb=String(cabOf(VIS.find(d=>d.ao===b)));
    return ca===cb?a.localeCompare(b):ca.localeCompare(cb)});
  const petugas=users.filter(u=>u.role==='petugas');
  const unassigned=aos.filter(a=>!AOMAP[a]).length;
  document.getElementById('content').innerHTML=`
  <div class="panel"><h3>Pembagian Data per AO <span class="mut">(otomatis dari kolom "Nama AO" saat upload)</span></h3>
    ${unassigned?`<div class="notif bad">⚠ ${unassigned} AO belum di-assign ke akun petugas — data mereka hanya terlihat oleh admin.</div>`:''}
    <div class="toolbar">
      <button class="btn-a" onclick="autoMatchAO()">⚡ Auto-kaitkan (AO = nama akun)</button>
      <span class="mut">Petugas yang login hanya melihat data AO yang dikaitkan dengan akunnya.</span>
    </div>
    <div style="overflow-x:auto"><table>
    <tr><th>Nama AO (di data)</th><th>Cabang</th><th class="r">Rekening</th><th class="r">✓ Sudah / ✗ Belum</th><th class="r">Total Outstanding</th><th class="r">Tunggakan</th><th>Di-assign ke Akun</th></tr>
    ${aos.map(a=>{
      const rows=VIS.filter(d=>d.ao===a);
      const asg=AOMAP[a]||'';
      const u=users.find(x=>x.user===asg);
      const sdh=rows.filter(d=>d.sudah_angsur).length;
      return `<tr><td><b>${esc(a)}</b></td><td>${esc(rows[0].cabang_nama||cabOf(rows[0]))}</td><td class="num">${rows.length}</td>
        <td class="num"><b style="color:#1c7a43">✓ ${sdh}</b> / <b style="color:var(--red)">✗ ${rows.length-sdh}</b></td>
        <td class="num">${rp(rows.reduce((s,d)=>s+d.outstanding,0))}</td>
        <td class="num" style="color:var(--red)">${rp(rows.reduce((s,d)=>s+Math.max(0,d.tak_pokok),0))}</td>
        <td><select data-ao="${esc(a)}" onchange="setAO(this.dataset.ao,this.value)">
          <option value="">— belum di-assign —</option>
          ${petugas.map(p=>`<option value="${esc(p.user)}" ${asg===p.user?'selected':''}>${esc(p.nama)} (${esc(p.user)})</option>`).join('')}
        </select> ${u?`<span class="badge b1">✔ ${esc(u.nama)}</span>`:'<span class="badge b2">kosong</span>'}</td></tr>`}).join('')}
    </table></div>
  </div>
  <div class="panel"><h3>Cara Kerja</h3>
    <ol style="margin-left:18px;font-size:13px;line-height:1.9">
      <li>Upload file tagihan → sistem otomatis memecah data berdasarkan kolom <b>Nama AO</b>.</li>
      <li>Di halaman ini, admin memilih <b>akun petugas</b> untuk tiap AO.</li>
      <li>Saat petugas login, ia hanya melihat: Beranda, Laporan Harian, Outstanding, dan Pinjaman & Call milik AO-nya saja.</li>
      <li>Tombol <b>Auto-kaitkan</b> mencocokkan nama AO dengan nama akun petugas secara otomatis.</li>
    </ol>
  </div>`;
}
function setAO(a,user){
  if(user)AOMAP[a]=user;else delete AOMAP[a];
  jsave(K.aomap,AOMAP);notify('Pembagian AO "'+a+'" diperbarui ✔');pgAO();
}
function autoMatchAO(){
  let n=0;
  const aos=[...new Set(DATA.map(d=>d.ao))];
  users.filter(u=>u.role==='petugas').forEach(u=>{
    if(Object.values(AOMAP).includes(u.user))return;
    const match=aos.find(a=>!AOMAP[a]&&(a.toUpperCase().includes(u.nama.toUpperCase())||u.nama.toUpperCase().includes(a.toUpperCase())));
    if(match){AOMAP[match]=u.user;n++}
  });
  jsave(K.aomap,AOMAP);
  notify(n?n+' AO otomatis dikaitkan ✔':'Tidak ada kecocokan otomatis — pilih manual',n>0);pgAO();
}

function openAddUser(){
  document.getElementById('nuCabang').innerHTML=cabangOptions('all');
  document.getElementById('mdlUser').style.display='flex';
}
function saveUser(){
  const n=nuNama.value.trim(),u=nuUser.value.trim(),p=nuPass.value,r=nuRole.value;
  let cb=nuCabang.value;
  if(cb==='__add'){
    const k=(prompt('Kode cabang (3 digit, sama seperti di nomor rekening):\nContoh: untuk rekening 541052000201, kodenya 052')||'').trim();
    if(!/^\d{3}$/.test(k)){notify('Kode cabang harus 3 digit angka, contoh: 052',false);return}
    if(k==='all'||CABANGS.some(c=>c.kode===k)){notify('Kode cabang sudah terdaftar',false);return}
    const nm=(prompt('Nama cabang (huruf kapital, contoh: LIMPUNG):')||'').trim().toUpperCase();
    if(!nm){notify('Nama cabang wajib diisi',false);return}
    CABANGS.push({kode:k,nama:nm});jsave(KCAB,CABANGS);cb=k;
    notify('Cabang '+k+' — '+nm+' ditambahkan ✔');
  }
  if(!n||!u||!p){notify('Lengkapi semua field!',false);return}
  if(r==='petugas'&&cb==='all'){notify('Akun Petugas/AO harus dipilih cabangnya!',false);return}
  if(users.find(x=>x.user===u)){notify('Username sudah dipakai!',false);return}
  users.push({nama:n,user:u,pass:p,role:r,cabang:cb});jsave(K.users,users);
  document.getElementById('mdlUser').style.display='none';
  nuNama.value=nuUser.value=nuPass.value='';notify('Akun dibuat ✔');pgUsr();
}
function delUser(u){if(confirm('Hapus akun '+u+'?')){users=users.filter(x=>x.user!==u);jsave(K.users,users);pgUsr()}}

/* ================= SINKRONISASI SERVER (Google Apps Script + Google Sheet) =================
   CARA PASANG (sekali saja, dikerjakan Pusat):
   1. Buat Google Sheet baru (mis. "KoperasiKu Server").
   2. Menu Extensions > Apps Script — tempel isi file Code.gs, sesuaikan SECRET.
   3. Deploy > New deployment > Web app: Execute as = Me, Access = Anyone. Salin URL-nya.
   4. Isi URL itu ke SYNC_URL di bawah, dan samakan SYNC_SECRET dengan SECRET di Code.gs.
   Kosongkan SYNC_URL jika ingin mode offline (data lokal saja). */
const SYNC_URL='https://script.google.com/macros/s/AKfycbzi3Y3SEqvAzFXqK0TAXq39nQg3QyhqF9P3P8mqVuYfoOpZELqqbBGwVEMA7NsF9lSJ/exec';
const SYNC_SECRET='kopena-sync-2026';
let SYNC_INFO=null;
function syncScope(){return (SES&&SES.cabang)||'all'}
async function syncGet(){
  const res=await fetch(SYNC_URL+'?secret='+encodeURIComponent(SYNC_SECRET),{cache:'no-store'});
  return await res.json();
}
async function syncSend(kind,records){
  const res=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({secret:SYNC_SECRET,kind,records,scope:syncScope()})});
  const j=await res.json();
  return j&&j.ok;
}
async function syncPull(manual){
  if(!SYNC_URL){if(manual)notify('URL server belum diisi (SYNC_URL)',false);return}
  try{
    const j=await syncGet();
    if(!j.ok)throw new Error(j.error||'server menolak');
    if(Array.isArray(j.data)){
      if(syncScope()==='all'){DATA=j.data}
      else{DATA=DATA.filter(d=>cabOf(d)!==syncScope()).concat(j.data.filter(d=>cabOf(d)===syncScope()))}
      DATA.forEach(d=>d.sudah_angsur=sudahAngsur(d));
      jsave(K.data,DATA);
    }
    if(Array.isArray(j.laporan)){
      const map={};LAP.forEach(l=>map[l.id]=l);j.laporan.forEach(l=>map[l.id]=l);
      LAP=Object.values(map);jsave(K.lap,LAP);
    }
    if(Array.isArray(j.users)&&j.users.length){
      users=j.users.filter(u=>u.user!=='admin');
      users.unshift({nama:'Administrator',user:'admin',pass:'admin123',role:'admin',cabang:'all'});
      jsave(K.users,users);
    }
    if(j.aomap&&typeof j.aomap==='object'){AOMAP=j.aomap;jsave(K.aomap,AOMAP)}
    if(Array.isArray(j.cabangs)&&j.cabangs.length){CABANGS=j.cabangs;jsave(KCAB,CABANGS)}
    SYNC_INFO=j.updatedAt;
    go(PAGE||'home');
    if(manual)notify('Sinkronisasi berhasil ✔ data terbaru dimuat');
  }catch(err){if(manual)notify('Gagal tarik data: '+err.message,false)}
}
async function syncPush(kind,quiet){
  if(!SYNC_URL){if(!quiet)notify('URL server belum diisi (SYNC_URL)',false);return}
  let records,msg;
  if(kind==='data'){records=syncScope()==='all'?DATA:DATA.filter(inCabang);msg='data '+records.length+' rekening'+(syncScope()==='all'?' (semua cabang)':' cabang '+syncScope())}
  else if(kind==='laporan'){records=LAP;msg='laporan '+records.length+' catatan'}
  else if(kind==='users'){if(syncScope()!=='all'){notify('Hanya akun Pusat yang boleh mengirim daftar akun',false);return}records=users;msg='daftar akun'}
  else if(kind==='aomap'){if(syncScope()!=='all'){notify('Hanya akun Pusat',false);return}records=AOMAP;msg='pemetaan AO'}
  else if(kind==='cabangs'){records=CABANGS;msg='daftar cabang'}
  const ok=await syncSend(kind,records);
  if(!quiet)notify(ok?'✓ Terkirim ke server: '+msg:'✗ Gagal kirim — cek koneksi & URL server',ok);
  return ok;
}
function pgSync(){
  const pusat=syncScope()==='all';
  document.getElementById('content').innerHTML=`
  <div class="panel"><h3>🔄 Sinkronisasi Server</h3>
    <p class="mut" style="margin-bottom:12px">Server: ${SYNC_URL?esc(SYNC_URL):'<b style="color:var(--red)">BELUM diisi</b> — lihat Cara Pasang di dalam file aplikasi (cari SYNC_URL), isi dengan URL Web App dari Code.gs'}
    ${SYNC_INFO?`<br>Update server terakhir: ${esc(SYNC_INFO)}`:''}</p>
    <div class="toolbar">
      <button class="btn-p" style="width:auto;margin:0" onclick="syncPull(true)">⬇️ Tarik data terbaru</button>
      <button class="btn-a" onclick="syncPush('data')">⬆️ Kirim data ${pusat?'(semua cabang)':'(cabang '+esc(syncScope())+')'}</button>
      <button class="btn-a" onclick="syncPush('laporan')">⬆️ Kirim laporan</button>
      ${pusat?'<button class="btn-s" onclick="syncPush(\'users\')">⬆️ Akun</button><button class="btn-s" onclick="syncPush(\'aomap\')">⬆️ Pemetaan AO</button><button class="btn-s" onclick="syncPush(\'cabangs\')">⬆️ Cabang</button>':''}
    </div>
    <p class="mut" style="margin-top:10px"><b>Alur kerja yang disarankan:</b><br>
    1. <b>Pusat</b> upload file Excel tiap cabang → klik <b>Kirim data</b> (semua cabang) → klik <b>Akun</b>, <b>Pemetaan AO</b>, <b>Cabang</b> sekali saja.<br>
    2. <b>Admin cabang</b>: sebelum mulai kerja klik <b>Tarik data terbaru</b> — data pusat & akun turun ke perangkatnya.<br>
    3. <b>Petugas AO</b>: kirim laporan call → admin/Pusat klik <b>Tarik data terbaru</b> → semua laporan terkumpul.<br>
    Data di server digabung <b>per cabang</b> — file cabang yang dikirim cabang hanya menimpa data cabang itu sendiri, tidak menyentuh cabang lain.</p>
  </div>`;
}

function printInit(title,sub){
  document.getElementById('printArea').innerHTML=`<h1>${esc(title)}</h1><div class="print-sub">${esc(sub)}</div>`;
}
function cetakLampiran(){
  const ao=SES.role==='admin'?(document.getElementById('rAO')?.value||''):'';
  const sort=document.getElementById('rSort').value;
  let rows=myData(); if(ao)rows=rows.filter(d=>d.ao===ao);
  rows.sort((a,b)=>sort==='rek'?String(a.rekening).localeCompare(String(b.rekening)):a.nama.localeCompare(b.nama));
  const tgl=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  printInit('Lampiran Kunjungan AO — KoperasiKu',`Dicetak ${tgl} · ${ao?'AO: '+ao:'Semua AO'} · ${rows.length} rekening`);
  document.getElementById('printArea').innerHTML+=`<table>
   <tr><th>No</th><th>No. Rekening</th><th>Nama Nasabah</th><th>Produk</th><th>Coll</th><th>Status Angsur</th><th>Angsuran/bln</th><th>Outstanding</th></tr>
   ${rows.map((d,i)=>`<tr><td>${i+1}</td><td>${d.rekening}</td><td>${esc(d.nama)}</td><td>${d.kode} ${esc(d.produk)}</td><td>${collLabel(d.coll_val)}</td><td>${d.sudah_angsur?'Sudah':'Belum'}</td><td class="num">${rp(d.tag_pokok)}</td><td class="num">${rp(d.outstanding)}</td></tr>`).join('')}
   <tr><td colspan="7" style="text-align:right"><b>TOTAL OUTSTANDING</b></td><td class="num"><b>${rp(rows.reduce((s,d)=>s+d.outstanding,0))}</b></td></tr>
  </table>`;
  window.print();
}
function cetakColl(){
  const f=document.getElementById('rColl').value;
  const st=document.getElementById('rStatus').value;
  const clamp=d=>Math.min(5,Math.max(1,d.coll_val||1));
  const rows=myData().filter(d=>(!f||clamp(d)==f)&&(!st||(d.sudah_angsur?1:0)==st));
  const tgl=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  printInit('Laporan Kolektibilitas (Coll) — KoperasiKu',`Dicetak ${tgl} · ${rows.length} rekening`);
  let h=`<table><tr><th>Kolektibilitas</th><th>Jumlah</th><th>Total Outstanding</th><th>Total Tunggakan</th></tr>`;
  [1,2,3,4,5].forEach(c=>{const g=rows.filter(d=>clamp(d)===c);
    h+=`<tr><td>${collLabel(c)}</td><td>${g.length}</td><td class="num">${rp(g.reduce((s,d)=>s+d.outstanding,0))}</td><td class="num">${rp(g.reduce((s,d)=>s+Math.max(0,d.tak_pokok),0))}</td></tr>`});
  h+=`</table>`;
  [1,2,3,4,5].forEach(c=>{const g=rows.filter(d=>clamp(d)===c);if(!g.length)return;
    h+=`<h2>${collLabel(c)} (${g.length})</h2><table>
     <tr><th>No</th><th>No. Rekening</th><th>Nama</th><th>AO</th><th>Status</th><th>Outstanding</th><th>Tunggakan</th></tr>
     ${g.sort((a,b)=>b.outstanding-a.outstanding).map((d,i)=>`<tr><td>${i+1}</td><td>${d.rekening}</td><td>${esc(d.nama)}</td><td>${esc(d.ao)}</td><td>${d.sudah_angsur?'Sudah':'Belum'}</td><td class="num">${rp(d.outstanding)}</td><td class="num">${rp(Math.max(0,d.tak_pokok))}</td></tr>`).join('')}
    </table>`});
  document.getElementById('printArea').innerHTML+=h;
  window.print();
}
