/* --- foto laporan disimpan di IndexedDB (tidak ikut batas ~5 MB localStorage) --- */
const FOTO_DB='kop_foto_db',FOTO_ST='foto';
let _fdb=null,FOTO_OK=false,_fotoT=null;
const FOTO_SAVED=new Set(),FOTO_BUSY=new Set();
function fotoDb(){
  return new Promise((res,rej)=>{
    if(_fdb)return res(_fdb);
    if(!window.indexedDB)return rej(new Error('IndexedDB tidak tersedia'));
    const rq=indexedDB.open(FOTO_DB,1);
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore(FOTO_ST)}catch(e){}};
    rq.onsuccess=()=>{_fdb=rq.result;_fdb.onclose=()=>{_fdb=null};res(_fdb)};
    rq.onerror=()=>rej(rq.error||new Error('gagal membuka IndexedDB'));
    rq.onblocked=()=>rej(new Error('IndexedDB terblokir'));
  });
}
function fotoPut(id,val){return fotoDb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(FOTO_ST,'readwrite');tx.objectStore(FOTO_ST).put(val,id);
  tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error||new Error('gagal simpan foto'));
}))}
function fotoDel(id){return fotoDb().then(db=>new Promise(res=>{
  const tx=db.transaction(FOTO_ST,'readwrite');tx.objectStore(FOTO_ST).delete(id);
  tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>res();
}))}
function fotoAll(){return fotoDb().then(db=>new Promise((res,rej)=>{
  const out={};const tx=db.transaction(FOTO_ST,'readonly');const rq=tx.objectStore(FOTO_ST).openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}};
  tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>rej(tx.error||new Error('gagal baca foto'));
}))}
async function fotoInit(){
  try{
    await fotoDb();
    const all=await fotoAll();
    let migrasi=0;
    for(const l of LAP){
      const id=String(l.id);
      if(all[id]){FOTO_SAVED.add(id);if(!l.foto)l.foto=all[id]}
      else if(l.foto){await fotoPut(id,l.foto);FOTO_SAVED.add(id);migrasi++}   /* pindahkan foto lama dari localStorage */
    }
    FOTO_OK=true;
    if(migrasi)jsaveLap();   /* tulis ulang laporan tanpa foto -> localStorage lega */
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){FOTO_OK=false}
}
/* simpan laporan: teks di localStorage, foto di IndexedDB. Foto baru tetap ikut di localStorage sampai IndexedDB mengonfirmasi, jadi tidak ada yang hilang. */
function jsaveLap(){
  const slim=l=>Object.assign({},l,{foto:null,fotoAda:true});
  let out=LAP.map(l=>(l.foto&&FOTO_OK&&FOTO_SAVED.has(String(l.id)))?slim(l):l);
  let ok=jsave(K.lap,out,true);
  if(!ok&&FOTO_OK){out=LAP.map(l=>l.foto?slim(l):l);ok=jsave(K.lap,out,true)}
  if(!ok&&!FOTO_OK){   /* cara lama: buang foto terlama bila penuh */
    for(let i=LAP.length-1;i>=0;i--){
      if(LAP[i].foto){LAP[i].foto=null;if(jsave(K.lap,LAP,true)){ok=true;break}}
    }
  }
  if(!ok)warnStorage();
  if(FOTO_OK){
    LAP.forEach(l=>{
      const id=String(l.id);
      if(l.foto&&!FOTO_SAVED.has(id)&&!FOTO_BUSY.has(id)){
        FOTO_BUSY.add(id);
        fotoPut(id,l.foto).then(()=>{FOTO_SAVED.add(id);FOTO_BUSY.delete(id);clearTimeout(_fotoT);_fotoT=setTimeout(jsaveLap,300)}).catch(()=>{FOTO_BUSY.delete(id)});
      }
    });
  }
  return ok;
}

/* --- antrian kirim: catat apa yang sudah terkirim, kirim ulang otomatis --- */
const KSENT='kop_terkirim',KQF='kop_antrian',QF_KINDS=['data','aomap','cabangs'];

let _flushing=false;
async function flushQueue(manual){
  if(!SES||!TOKEN||!SYNC_URL||_flushing)return;
  _flushing=true;
  try{
    const u=qUnsent(),kinds=[];
    if(u.laporan)kinds.push('laporan');
    if(u.pencairan)kinds.push('pencairan');
    QF_KINDS.forEach(k=>{if(QF[k])kinds.push(k)});
    let gagal=false;
    for(const k of kinds){const ok=await syncPush(k,true,true);if(!ok){gagal=true;break}}

  }finally{_flushing=false;hitungLs();qBar()}
}

function parseAgunanGlobal(TM){
  const items=[];
  const splitIdx=TM.indexOf('Kontrak Ditutup sebagai Debitur');
  const re=/(\d+)\.\s*Detail\s+Agunan\b/gi;
  const all=[];let m;
  while((m=re.exec(TM))!==null)all.push({no:+m[1],idx:m.index,len:m[0].length});
  for(let i=0;i<all.length;i++){
    const cur=all[i];
    const start=cur.idx+cur.len;
    let end=i+1<all.length?all[i+1].idx:TM.length;
    const tail=TM.slice(start,end);
    const stopM=tail.match(/Detail\s+Penjamin|Detail\s+Kalender\s+Pembayaran|\b\d+\.\s*Fasilitas\s+Pinjaman\b|Kontrak\s+Ditutup\s+sebagai\s+Debitur|Kontrak\s+Aktif\s+sebagai\s+Debitur/);
    if(stopM)end=start+stopM.index;
    const body=TM.slice(start,end);
    const f=extractAgunanFields(body);
    if(Object.keys(f).length>=2){
      f._no=cur.no;
      f._aktif=(splitIdx===-1)||(cur.idx<splitIdx);
      items.push(f);
    }
  }
  return items;
}

function parse(T,p1,TM){
const g=(re,s=T)=>{const m=s.match(re);return m?m[1].trim():''},D='(?=\\s{2}|\\n|$)';
const nm=(()=>{const a=g(new RegExp('Nama berdasarkan identitas\\s+(.+?)'+D));if(a&&a!=='-')return a;
const b=g(new RegExp('Nama Lengkap\\s+(.+?)'+D));if(b&&b!=='-')return b;
const i=p1.findIndex(l=>l.startsWith('Nomor Identitas'));
if(i>0){const c=p1[i-1].trim().replace(/^¦\s*/,'');if(c.length>3&&/^[A-Za-z\s.'-]+$/.test(c))return c}return'-'})();
const kr=(()=>{const a=g(new RegExp('Pekerjaan\\s{2}(.+?)'+D)),t=g(new RegExp('Nama tempat bekerja\\s+(.+?)'+D));return a+(t&&t!=='NA'&&t!=='-'?' ('+t+')':'')})();
const d={nama:nm,nik:g(/Nomor Identitas\s+(\d{16})/),lahir:g(new RegExp('Tanggal Lahir\\s+(.+?)'+D)),kerja:kr,
skor:+g(/Skor\s+(\d{2,4})\s+Kategori Risiko/),kat:g(/Kategori Risiko\s+(\w+)/),
dpd:g(/Kemungkinan DPD 90\+\s*:?\s*([\d.,]+)%/),desk:g(new RegExp('Deksripsi Risiko\\s+(.+?)'+D)),
faktor:g(/Faktor[- ]Faktor Risiko\s+(.+?)(?:\n|$)/),
aktif:g(/Jumlah kontrak aktif\s+(\d+)/),tutup:g(/Jumlah kontrak ditutup\s+(\d+)/),
tg:n(g(/Jumlah nilai tunggakan\s+Rp\.?\s*([\d.]+)/)),plafon:n(g(/Total plafon kredit\s+Rp\.?\s*([\d.]+)/)),
saldo:n(g(/Total nilai saldo terutang\s+Rp\.?\s*([\d.]+)/)),hrw:g(/Hari tunggakan terburuk\s+(\d+)/),
klw:g(/Kolektibilitas terburuk\s+(\d)/),cal:{},k:[]};
d.ex=(d.skor===9999)||/excluded/i.test(d.desk||'')||d.kat==='XX'||/tidak dapat dihitung/i.test(d.faktor||'');
for(const l of p1){const m=l.match(/^(20\d\d)\s/);if(m&&!d.cal[m[1]]){const t=[...l.replace(/\s*\|\s*/g,'|').matchAll(/(\d)\|(\d+)|n\/a/g)];
if(t.length>=12)d.cal[m[1]]=t.slice(0,12).map(x=>x[1]?[+x[1],+x[2]]:null)}}
const a=((TM||T).split('Kontrak Aktif sebagai Debitur')[1]||'').split('Kontrak Ditutup sebagai Debitur')[0];
for(const b of a.split(/^\d+\. Fasilitas.*$/m).slice(1)){
const ls=b.split('\n'),ml=ls.findIndex(x=>/Rp\. [\d.]+\s+Rp\. [\d.]+\s+\d\d \w{3} \d{4}/.test(x)),
m=b.match(/Rp\. ([\d.]+)\s+Rp\. ([\d.]+)\s+(\d\d \w{3} \d{4})/)||[],
q=b.match(/Rp\. ([\d.]+)\s+(\d+) Hari\s+(\d) - /)||[],
j=b.match(/Tanggal mulai\s+(\d\d \w{3} \d{4})\s+Tanggal jatuh tempo\s+(\d\d \w{3} \d{4})/)||[];
const c={pel:(()=>{let nn=(ls[ml]||'').split('  ')[0]||'';for(let k=ml+1;k<ml+4;k++){const l=ls[k]||'';if(/^(¦\s*)?(Tipe Pelapor|Halaman|PT PEFINDO)/.test(l))break;const sg=l.split('  ');if(sg[0]!=='¦')nn+=' '+sg[0]}return nn.trim()})(),
tipe:g(new RegExp('Jenis Kredit\\s+(.+?)'+D),b),saldo:n(m[1]),plafon:n(m[2]),upd:m[3],
tg:n(q[1]),hari:+q[2]||0,kol:+q[3]||1,bunga:+g(/Bunga pinjaman\s+([\d.]+)%/,b)||0,
mulai:j[1],jt:j[2],st:g(new RegExp('Status kontrak\\s+(.+?)'+D),b),
klw:+g(/Kolektibilitas terburuk\s+(\d)\s/,b)||1,hrw:+g(/Hari tunggakan terburuk saat Ini\s+(\d+)/,b)||0,

c.bad=/hapus/i.test(c.st)||c.klw===5;c.hiRate=c.bunga>100;c.mode=mode(c.bunga,c.tipe);
if(!c.bad&&c.jt)c.A=est(c.saldo,c.bunga,mo(dt(c.upd),dt(c.jt)),c.mode);

const SLK_INSTRUKSI='Kamu analis pembiayaan senior (koperasi/BPR). Berikut RINGKASAN SLIK/PEFINDO IdScore+ seorang calon debitur yang SEDANG MENGAJUKAN pembiayaan (identitas sengaja dihilangkan). Beri saran dan masukan berbahasa Indonesia untuk petugas dan komite. Pakai judul bagian HURUF KAPITAL berikut: KESIMPULAN SEMENTARA (pilih salah satu: layak / layak dengan syarat / ditunda atau sebaiknya ditolak, beserta alasan inti 2-3 kalimat; tegaskan ini pertimbangan, bukan keputusan final); KONDISI KEWAJIBAN SAAT INI (kontrak aktif, tunggakan, kontrak macet, bunga tinggi atau flat, riwayat keterlambatan dari kalender); KEMAMPUAN BAYAR (estimasi cicilan berjalan, rasio terhadap penghasilan dengan batas wajar 40% bila penghasilan diisi, bila tidak sebut penghasilan minimal yang dibutuhkan); AGUNAN (agunan aktif dan kecukupannya terhadap plafon diajukan bila ada); RISIKO DAN HAL YANG HARUS DIVERIFIKASI; SARAN STRUKTUR PEMBIAYAAN (plafon, tenor, angsuran maksimal yang wajar, syarat tambahan seperti pelunasan kewajiban lain, agunan tambahan, atau penjamin); LANGKAH BERIKUTNYA (dokumen dan pengecekan lapangan). Aturan: hanya gunakan angka yang diberikan, jangan mengarang; skor 9999/XX berarti skor tidak dapat dihitung, bukan skor tinggi; sebut bila data tidak tersedia; jangan menebak identitas; tulis teks biasa tanpa markdown (tanpa tanda ** atau #), poin memakai tanda -; maksimal sekitar 400 kata.';
function slkRingkas(d){
  const val=id=>n((($(id)||{}).value||'').replace(/\D/g,''));
  const P=val('slkAiP'),T=val('slkAiT'),NB=val('slkNb'),PG=val('slkPg');
  const bln=[];Object.keys(d.cal).sort().forEach(y=>d.cal[y].forEach(x=>{if(x)bln.push(x)}));
  const l24=bln.slice(-24),l12=bln.slice(-12);
  const lh=dt(d.lahir),umur=lh?Math.floor((Date.now()-lh.getTime())/31557600000):null;
  const lo=d.lo+NB,hi=d.hi+NB;
  const r={_instruksi:SLK_INSTRUKSI,
    debitur:{umur_tahun:umur,pekerjaan:String(d.kerja||'').replace(/\s*\(.*\)\s*$/,'')||null},
    skor:{nilai:d.ex?null:d.skor,kategori:d.ex?null:d.kat,dpd90_plus_pct:d.dpd||null,tidak_dapat_dihitung:!!d.ex,faktor_risiko:d.faktor||null},
    ringkasan:{kontrak_aktif:+d.aktif||0,kontrak_ditutup:+d.tutup||0,total_plafon:d.plafon,total_sisa_utang:d.saldo,total_tunggakan:d.tg,sisa_utang_macet:d.sisaBad,
      kolektibilitas_terburuk:+d.klw||null,hari_tunggakan_terburuk:+d.hrw||0,
      estimasi_cicilan_berjalan:d.k.some(c=>c.A)?{min:Math.round(d.lo),maks:Math.round(d.hi)}:null},
    kalender_24_bulan:{bulan_terbaca:l24.length,bulan_kol_2_ke_atas:l24.filter(x=>x[0]>=2).length,bulan_kol_3_ke_atas:l24.filter(x=>x[0]>=3).length,
      kol_terburuk_12_bulan:l12.length?Math.max.apply(null,l12.map(x=>x[0])):null,hari_tunggakan_maks_24_bulan:l24.length?Math.max.apply(null,l24.map(x=>x[1])):null,
      urutan_kol_terbaru_ke_lama:Object.keys(d.cal).sort().reverse().slice(0,2).map(y=>y+': '+d.cal[y].map(x=>x?x[0]:'-').join(' '))},
    kontrak_aktif:d.k.slice(0,25).map((c,i)=>({no:i+1,jenis_kredit:c.tipe||null,status:c.st||null,macet_atau_hapus_buku:!!c.bad,plafon:c.plafon,sisa_utang:c.saldo,tunggakan:c.tg,hari_tunggakan:c.hari,
      kolektibilitas:c.kol,kol_terburuk:c.klw,hari_tunggakan_terburuk:c.hrw,bunga_pct_per_tahun:c.bunga,skema:c.mode,mulai:c.mulai||null,jatuh_tempo:c.jt||null,
      estimasi_cicilan:c.A?{min:Math.round(c.A[0]),maks:Math.round(c.A[1])}:null})),
    agunan_aktif:d.agunanList.filter(a=>a._aktif).slice(0,10).map(a=>({tipe:a.tipe||null,nilai_pelapor:a.nilai||null,njop:a.njop||null,asuransi:a.asuransi||null,jenis_ikatan:a.jenisIkat||null,tgl_pengikatan:a.tglIkat||null})),
    total_agunan_aktif:d.totalAgunan||0,
    pengajuan:{plafon_diajukan:P||null,tenor_bulan:T||null,angsuran_baru:NB||null,penghasilan_bulanan:PG||null,
      keterangan:(($('slkAiK')||{}).value||'').trim().slice(0,120)||null,
      cicilan_total_setelah_pengajuan:(d.k.some(c=>c.A)||NB)?{min:Math.round(lo),maks:Math.round(hi)}:null,
      dti_pct:PG?{min:Math.round(lo/PG*100),maks:Math.round(hi/PG*100)}:null}};
  return r;
}
window.slkAI=async function(){
  const d=CUR,out=$('slkAiOut'),btn=$('slkAiBtn');if(!d||!out)return;
  btn.disabled=true;
  try{
    out.innerHTML='<p class="mu">\u23F3 AI sedang menyusun saran (bisa 10\u201330 detik)\u2026</p>';
    const j=await apiCall('analisa_ai',{ringkas:slkRingkas(d)});
    if(!j||!j.ok){out.innerHTML='';notify(pesanAI(j&&j.error),false);return}
    window._slkAiTeks=j.teks;
    out.innerHTML='<div class="ai-txt" style="margin:10px 0;padding:10px;background:#f6f9f8;border-radius:10px;font-size:13.5px">'+aiFmt(j.teks)+'</div>'
      +'<div class="slkbar"><button type="button" onclick="slkSalinAI()">\uD83D\uDCCB Salin</button></div>'
      +'<div class="mu">Saran AI dari ringkasan angka SLIK, bukan keputusan kredit: verifikasi data dan putuskan sesuai kebijakan.'+(j.sisa!=null?' Sisa analisa hari ini: '+j.sisa+'.':'')+'</div>';
  }catch(e){out.innerHTML='';notify('Gagal: '+e.message,false)}
  finally{btn.disabled=false}
};
window.slkSalinAI=function(){const t=window._slkAiTeks||'';

  else notify('Browser tidak mendukung salin otomatis',false)};
window.slkClear=function(){CUR=null;window._slkAiTeks='';const o=document.getElementById('slkOut'),s=document.getElementById('slkSt'),f=document.getElementById('slkF');if(o)o.innerHTML='';if(s)s.textContent='';if(f)f.value=''};
